name: Generate Go Dependencies

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: true

    - name: Run go mod tidy
      run: go mod tidy

    - name: Verify dependencies
      run: go mod verify

    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: "chore: update go.sum dependencies"
        title: "chore: update go.sum dependencies"
        body: |
          Automated dependency update via `go mod tidy`.

          This PR was auto-generated by the `generate-deps` workflow.
        branch: chore/update-deps
        delete-branch: true
        labels: dependencies, automated

    - name: Check output
      if: steps.cpr.outputs.pull-request-number != ''
      run: |
        echo "Pull request #${{ steps.cpr.outputs.pull-request-number }} created"
        echo "URL: ${{ steps.cpr.outputs.pull-request-url }}"
