name: Generate go.sum

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - '.github/workflows/generate-gosum.yml'  # Trigger on self-change

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true
    
    - name: Generate go.sum
      run: |
        go mod tidy
        go mod verify
    
    - name: Commit go.sum
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: Generate go.sum with dependency hashes

Generated by GitHub Actions workflow.
Dependencies verified with 'go mod verify'.

This file is required for reproducible builds.
See: https://go.dev/ref/mod#go-sum-files"
        file_pattern: "go.sum"
        branch: main
        create_branch: false
