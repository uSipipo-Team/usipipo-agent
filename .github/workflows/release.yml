name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Test with race detection
      run: go test -race -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o usipipo-agent-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/agent

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: usipipo-agent-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        path: usipipo-agent-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      run: |
        cd artifacts
        for dir in */; do
          cd "$dir"
          zip -r ../${dir%/}.zip .
          cd ..
        done

    - name: Copy install script
      run: |
        cp scripts/install.sh artifacts/install.sh
        chmod +x artifacts/install.sh

    - name: Generate SHA256 checksums
      run: |
        cd artifacts
        sha256sum *.zip > SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/*.zip
          artifacts/SHA256SUMS
          artifacts/install.sh
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
